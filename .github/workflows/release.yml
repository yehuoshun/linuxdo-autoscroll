name: 打包发布 Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 打包 zip
        run: |
          mkdir -p dist
          zip -r dist/linuxdo-autoscroll.zip manifest.json background.js content.js popup.html popup.js README.md

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/linuxdo-autoscroll.zip
          skip-if-release-exists: true